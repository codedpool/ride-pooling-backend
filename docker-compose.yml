version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: ride_pooling_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: ridepooling
    ports:
      - "5433:5432"  # Changed to 5433 to avoid conflict with your pgAdmin PostgreSQL
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB

  redis:
    image: redis:7-alpine
    container_name: ride_pooling_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data:
